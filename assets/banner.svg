<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3a60"/><stop offset="0.65" stop-color="#34284a"/><stop offset="1" stop-color="#2a2030"/></linearGradient>
    <linearGradient id="moor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2818"/><stop offset="1" stop-color="#241d14"/></linearGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#dusk)"/>

  <!-- gloaming moon, high right corner, clear of everything -->
  <circle cx="1196" cy="64" r="32" fill="#f5f0e8" opacity="0.9"/>
  <circle cx="1185" cy="58" r="28" fill="#4a3a60" opacity="0.55"/>

  <!-- ART ZONE (x > 930): the wild haggis mid-drift -->
  <path d="M948 168 C 1004 124, 1116 124, 1140 178 C 1158 222, 1104 254, 1052 240"
        fill="none" stroke="#ffc840" stroke-width="3.5" stroke-dasharray="4 11" stroke-linecap="round" opacity="0.9"/>
  <path d="M1052 240 l18 -10 -4 19 Z" fill="#ffc840"/>

  <g fill="#ffc840">
    <path d="M972 142 l9 12 -9 12 -9 -12 Z" opacity="0.95"/>
    <path d="M1146 146 l8 10 -8 10 -8 -10 Z" opacity="0.75"/>
  </g>

  <!-- the haggis: big, shaggy, famously uneven legs -->
  <g transform="translate(1044,204) rotate(-7)">
    <ellipse cx="0" cy="0" rx="62" ry="44" fill="#5a3e20"/>
    <ellipse cx="-10" cy="-10" rx="52" ry="32" fill="#6b4a26"/>
    <ellipse cx="-16" cy="-16" rx="38" ry="20" fill="#7a5630" opacity="0.7"/>
    <g stroke="#3a2818" stroke-width="5" stroke-linecap="round">
      <line x1="-52" y1="26" x2="-58" y2="40"/><line x1="-36" y1="36" x2="-40" y2="50"/>
      <line x1="-18" y1="41" x2="-20" y2="55"/><line x1="0" y1="43" x2="0" y2="57"/><line x1="18" y1="41" x2="21" y2="54"/>
    </g>
    <g stroke="#3a2818" stroke-width="9" stroke-linecap="round">
      <line x1="-38" y1="38" x2="-42" y2="58"/>
      <line x1="-16" y1="42" x2="-18" y2="64"/>
      <line x1="12" y1="42" x2="16" y2="74"/>
      <line x1="36" y1="34" x2="44" y2="68"/>
    </g>
    <circle cx="44" cy="-14" r="5.5" fill="#2a2030"/>
    <circle cx="46" cy="-16" r="1.8" fill="#f5f0e8"/>
    <path d="M52 0 q8 4 5 12" stroke="#2a2030" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M18 -40 q8 -8 18 -6 M32 -33 q9 -6 17 -2" stroke="#3a2818" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g fill="#f5f0e8" opacity="0.35"><circle cx="-78" cy="20" r="5"/><circle cx="-92" cy="28" r="3.5"/><circle cx="-104" cy="34" r="2.5"/></g>
  </g>

  <!-- moor ridges -->
  <path d="M0 292 C 220 256, 430 298, 660 282 S 1040 250, 1280 286 L1280 360 L0 360 Z" fill="url(#moor)"/>
  <path d="M0 326 C 300 306, 560 332, 820 320 S 1140 304, 1280 322 L1280 360 L0 360 Z" fill="#1c1610"/>

  <!-- heather on the ridge, grounded -->
  <g stroke="#9070b0" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <line x1="150" y1="290" x2="150" y2="268"/><line x1="141" y1="290" x2="137" y2="274"/><line x1="159" y1="290" x2="163" y2="274"/>
    <line x1="540" y1="294" x2="540" y2="274"/><line x1="532" y1="294" x2="528" y2="280"/><line x1="548" y1="294" x2="552" y2="280"/>
  </g>
  <g fill="#b090d0">
    <circle cx="150" cy="263" r="5.5"/><circle cx="137" cy="270" r="4"/><circle cx="163" cy="270" r="4"/>
    <circle cx="540" cy="269" r="5"/><circle cx="528" cy="276" r="3.5"/><circle cx="552" cy="276" r="3.5"/>
  </g>

  <!-- TEXT ZONE: clean column -->
  <text x="80" y="148" font-size="74" font-weight="800" fill="#f5f0e8" letter-spacing="0.5">Wild Haggis Survivors</text>
  <text x="84" y="196" font-size="21" font-weight="600" fill="#ffc840" letter-spacing="3.5">A HIGHLAND-AT-DUSK BULLET HEAVEN</text>
  <text x="84" y="230" font-size="17" font-weight="500" fill="#b090d0" letter-spacing="2.5">EVERY INPUT DRIFTS A FEW DEGREES CLOCKWISE &#183; BLAME THE LEGS</text>
</svg>
