name: Nightly soak

# The marathon smoke (30 simulated game-minutes: leak slopes, FPS floor,
# audio survival) is too slow for the push gate and currently fails on
# GitHub runners: the enemy-pool slope reads ~27/min against a 1.5
# threshold while FPS holds. That is either a real accumulation bug or a
# runner-throughput artifact — tracked here nightly until diagnosed, so
# the signal stays visible without blocking every push.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marathon:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Marathon soak
        run: npx playwright test --grep "Marathon smoke"
        env:
          CI: true
