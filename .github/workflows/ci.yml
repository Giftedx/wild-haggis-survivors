name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Cross-engine e2e (chromium + firefox + webkit desktop + chromium mobile)
    # runs serially (playwright workers: 1) and is the dominant cost — the
    # firefox+webkit projects alone are ~25-30 min. 20 was sized for the old
    # chromium-only gate; 60 gives headroom so the job fails on real errors,
    # not a timeout.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Key splits by engine set: pull requests install chromium only,
          # pushes to master/main install all three. A shared key would make
          # the chromium-only cache evict the full set and re-download the
          # extra engines on every landing.
          key: playwright-${{ github.event_name == 'pull_request' && 'chromium' || 'all' }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        # Engine diet (2026-08-06, billing API: this workflow burned 1,368
        # minutes in July and 1,328 in the first six days of August — the
        # largest line in the portfolio, on a $0 spending limit). The
        # firefox+webkit projects are ~25-30 min per run. Pull requests gate
        # on the chromium projects; pushes to master/main run the full
        # engine set, so cross-engine sanity still gates every landing.
        run: npx playwright install --with-deps ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium firefox webkit' }}

      - name: Lint, unit tests, build, budgets
        run: npm run ci
        env:
          CI: true

      - name: E2E
        # Pull requests: chromium-desktop + chromium-mobile (names from
        # playwright.config.ts). Pushes to master/main: every project.
        # Includes the 30-sim-minute marathon soak: it fast-forwards spawn
        # timing (skipToMinute), so wall-clock is ~25 s, not 30 min.
        run: npx playwright test ${{ github.event_name == 'pull_request' && '--project=chromium-desktop --project=chromium-mobile' || '' }}
        env:
          CI: true
