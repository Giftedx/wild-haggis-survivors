name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Cross-engine e2e (chromium + firefox + webkit desktop + chromium mobile)
    # runs serially (playwright workers: 1) and is the dominant cost — the
    # firefox+webkit projects alone are ~25-30 min. 20 was sized for the old
    # chromium-only gate; 60 gives headroom so the job fails on real errors,
    # not a timeout.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # `-all` marks the full engine set (chromium + firefox + webkit).
          # Bump distinguishes it from the old chromium-only cache so the
          # extra engines actually get cached rather than re-downloaded.
          key: playwright-all-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (all engines)
        # playwright.config.ts defines firefox-desktop + webkit-desktop
        # projects (cross-engine sanity) alongside chromium; `npm run
        # test:e2e` (via ci:all) runs them all, so CI must install all three
        # or those projects fail to launch and the e2e gate is meaningless.
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Lint, unit tests, build, budgets
        run: npm run ci
        env:
          CI: true

      - name: E2E (all engines, marathon soak excluded)
        # The 30-sim-minute marathon soak runs ~12 min per attempt and has
        # never passed on a GitHub runner (enemy-pool slope trips the leak
        # threshold there — see nightly.yml, where it now lives as a tracked
        # signal). Every other spec runs here on every push.
        run: npx playwright test --grep-invert "Marathon smoke"
        env:
          CI: true
